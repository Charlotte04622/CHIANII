<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIANII (佳妮) 的生日禮物許願池</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome 圖示 -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<!-- Confetti 煙火特效 -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@400;600;900&display=swap');

body {
background-color: #08080a;
color: #f1f1f1;
font-family: 'Noto Serif TC', serif;
}
.font-en { font-family: 'Cinzel', serif; }
.gold-gradient-text {
background: linear-gradient(135deg, #fce0ad 0%, #dfac6c 50%, #c68642 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
.gold-card {
background: rgba(18, 18, 22, 0.75);
backdrop-filter: blur(12px);
border: 1px solid rgba(223, 172, 108, 0.18);
transition: all 0.3s ease;
}
.gold-card:hover {
border-color: rgba(223, 172, 108, 0.5);
transform: translateY(-4px);
box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(223, 172, 108, 0.15);
}
</style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-amber-600 selection:text-white">

<!-- 頂部導覽列 -->
<header class="sticky top-0 z-40 bg-[#08080a]/90 backdrop-blur-md border-b border-[#dfac6c]/20 px-6 py-4">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<div class="flex items-center space-x-3">
<i class="fa-solid fa-moon text-amber-300 text-xl"></i>
<span class="font-en text-xl tracking-widest font-bold gold-gradient-text">CHINA'S POOL</span>
</div>
<div class="flex items-center space-x-3">
<button onclick="copyShareLink()" class="px-3 py-1.5 rounded-full text-xs font-medium border border-amber-400/40 text-amber-200 hover:bg-amber-400/10 transition flex items-center gap-1.5">
<i class="fa-solid fa-share-nodes"></i> 分享
</button>
<button onclick="toggleAdminModal()" class="px-3 py-1.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-300 border border-amber-500/30 hover:bg-amber-500/20 transition flex items-center gap-1.5">
<i class="fa-solid fa-key"></i> 後台
</button>
</div>
</div>
</header>

<!-- 主視覺區塊 -->
<main class="max-w-4xl mx-auto px-4 py-10">
<div class="text-center space-y-4 mb-12">
<p class="font-en text-xs tracking-[0.3em] text-amber-400/80 uppercase">Happy Birthday Wish Pool</p>
<h1 class="text-3xl md:text-5xl font-black tracking-wider gold-gradient-text">
佳妮 CHINA・生日禮物許願池
</h1>
<p class="text-gray-400 text-xs md:text-sm max-w-xl mx-auto leading-relaxed">
投下一枚心願金幣，寫下想送給佳妮的生日驚喜，或由 CHINA 親自許下今年的夢想清單！
</p>
<div class="pt-3">
<button onclick="openWishModal()" class="px-8 py-3.5 rounded-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 text-black font-bold tracking-widest shadow-lg shadow-amber-500/20 hover:scale-105 active:scale-95 transition-all flex items-center gap-2 mx-auto">
<i class="fa-solid fa-coins"></i> 投幣許願
</button>
</div>
</div>

<!-- 禮物列表 -->
<div class="mb-6 flex justify-between items-center border-b border-white/10 pb-4">
<h2 class="text-base font-bold text-amber-200/90 flex items-center gap-2">
<i class="fa-solid fa-sparkles text-amber-400"></i> 池中的心願清單
</h2>
<span id="wishCountBadge" class="text-xs text-gray-400">共 0 個心願</span>
</div>

<div id="wishesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- 卡片由 JS 動態生成 -->
</div>

<div id="emptyState" class="text-center py-20 text-gray-500 space-y-3">
<i class="fa-solid fa-water text-4xl opacity-30"></i>
<p class="text-sm">池水清澈如鏡，靜候投下第一個心願...</p>
</div>
</main>

<!-- 許願彈窗 -->
<div id="wishModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
<div class="bg-[#121216] border border-amber-500/30 rounded-2xl w-full max-w-md p-6 relative">
<button onclick="closeWishModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
<i class="fa-solid fa-xmark text-xl"></i>
</button>
<h3 class="text-lg font-bold gold-gradient-text mb-4 flex items-center gap-2">
<i class="fa-solid fa-coins text-amber-400"></i> 投下一枚心願
</h3>
<form id="wishForm" onsubmit="submitWish(event)" class="space-y-4">
<div>
<label class="block text-xs text-gray-400 mb-1">禮物名稱 *</label>
<input type="text" id="giftName" required placeholder="例如：某款香水、耳機、大餐..." class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm focus:border-amber-400 outline-none">
</div>
<div>
<label class="block text-xs text-gray-400 mb-1">許願人 / 填寫者暱稱 *</label>
<input type="text" id="wisherName" required placeholder="你的名字或暱稱" class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm focus:border-amber-400 outline-none">
</div>
<div>
<label class="block text-xs text-gray-400 mb-1">祝福或想要的理由</label>
<textarea id="wishNote" rows="3" placeholder="寫點給佳妮的祝福或推薦理由吧！" class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm focus:border-amber-400 outline-none"></textarea>
</div>
<div>
<label class="block text-xs text-gray-400 mb-1">參考連結（選填）</label>
<input type="url" id="giftUrl" placeholder="https://..." class="w-full bg-black/60 border border-white/15 rounded-lg px-3 py-2 text-sm focus:border-amber-400 outline-none">
</div>
<button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 text-black font-bold rounded-lg hover:brightness-110 transition mt-2">
確認送入許願池
</button>
</form>
</div>
</div>

<!-- 後台管理彈窗 -->
<div id="adminModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
<div class="bg-[#121216] border border-amber-500/40 rounded-2xl w-full max-w-xl max-h-[85vh] flex flex-col p-6 relative">
<button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
<i class="fa-solid fa-xmark text-xl"></i>
</button>

<div id="adminLoginArea" class="py-10 text-center space-y-4">
<i class="fa-solid fa-shield-halved text-4xl text-amber-400"></i>
<h3 class="text-lg font-bold text-white">CHINA 專屬管理後台</h3>
<p class="text-xs text-gray-400">請輸入管理密碼（預設密碼：8888 或 china）</p>
<div class="flex max-w-xs mx-auto gap-2">
<input type="password" id="adminPassword" placeholder="輸入密碼..." class="bg-black border border-white/20 rounded px-3 py-2 text-sm w-full outline-none focus:border-amber-400">
<button onclick="checkAdminPassword()" class="px-4 py-2 bg-amber-500 text-black font-bold rounded text-sm hover:brightness-110">解鎖</button>
</div>
</div>

<div id="adminPanelArea" class="hidden flex-1 overflow-hidden flex flex-col">
<div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
<h3 class="text-base font-bold gold-gradient-text flex items-center gap-2">
<i class="fa-solid fa-sliders text-amber-400"></i> 心願池管理列表
</h3>
<button onclick="logoutAdmin()" class="text-xs text-red-400 hover:underline">登出</button>
</div>
<div class="flex-1 overflow-y-auto space-y-2 pr-1" id="adminWishesList">
<!-- 後台項目 -->
</div>
</div>
</div>
</div>

<script>
let wishes = JSON.parse(localStorage.getItem('china_birthday_wishes') || '[]');

function saveWishes() {
localStorage.setItem('china_birthday_wishes', JSON.stringify(wishes));
renderWishes();
renderAdminWishes();
}

function renderWishes() {
const grid = document.getElementById('wishesGrid');
const empty = document.getElementById('emptyState');
const badge = document.getElementById('wishCountBadge');

badge.innerText = `共 ${wishes.length} 個心願`;

if (wishes.length === 0) {
grid.innerHTML = '';
empty.classList.remove('hidden');
return;
}

empty.classList.add('hidden');
grid.innerHTML = wishes.map((w, index) => `
<div class="gold-card rounded-xl p-5 flex flex-col justify-between">
<div>
<div class="flex justify-between items-start mb-2">
<h3 class="text-base font-bold text-amber-100">${escapeHtml(w.name)}</h3>
<button onclick="cheerWish(${index})" class="text-xs border border-amber-500/30 px-2 py-0.5 rounded-full text-amber-300 hover:bg-amber-500/20 flex items-center gap-1">
<i class="fa-solid fa-heart text-rose-500"></i> ${w.likes || 0}
</button>
</div>
<p class="text-xs text-gray-400 mb-2"><i class="fa-solid fa-user text-amber-400/60 mr-1"></i>許願人：${escapeHtml(w.by)}</p>
${w.note ? `<p class="text-xs text-gray-300 bg-black/40 p-3 rounded-lg border border-white/5 mb-3 leading-relaxed">${escapeHtml(w.note)}</p>` : ''}
</div>
${w.url ? `<a href="${w.url}" target="_blank" class="text-xs text-amber-400/80 hover:text-amber-300 flex items-center gap-1 mt-2 underline"><i class="fa-solid fa-arrow-up-right-from-square"></i> 查看商品/參考連結</a>` : ''}
</div>
`).join('');
}

function cheerWish(index) {
wishes[index].likes = (wishes[index].likes || 0) + 1;
saveWishes();
confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
}

function openWishModal() { document.getElementById('wishModal').classList.remove('hidden'); }
function closeWishModal() { document.getElementById('wishModal').classList.add('hidden'); }

function submitWish(e) {
e.preventDefault();
const newWish = {
id: Date.now(),
name: document.getElementById('giftName').value,
by: document.getElementById('wisherName').value,
note: document.getElementById('wishNote').value,
url: document.getElementById('giftUrl').value,
likes: 0,
time: new Date().toLocaleString()
};
wishes.unshift(newWish);
saveWishes();
closeWishModal();
document.getElementById('wishForm').reset();
confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
}

function toggleAdminModal() {
document.getElementById('adminModal').classList.toggle('hidden');
}

function checkAdminPassword() {
const pwd = document.getElementById('adminPassword').value.trim().toLowerCase();
if (pwd === '8888' || pwd === 'china') {
document.getElementById('adminLoginArea').classList.add('hidden');
document.getElementById('adminPanelArea').classList.remove('hidden');
renderAdminWishes();
} else {
alert('密碼錯誤！請輸入 8888 或 china');
}
}

function logoutAdmin() {
document.getElementById('adminLoginArea').classList.remove('hidden');
document.getElementById('adminPanelArea').classList.add('hidden');
document.getElementById('adminPassword').value = '';
}

function renderAdminWishes() {
const list = document.getElementById('adminWishesList');
if (wishes.length === 0) {
list.innerHTML = '<p class="text-gray-500 text-xs text-center py-6">目前沒有任何心願紀錄</p>';
return;
}
list.innerHTML = wishes.map((w, index) => `
<div class="bg-black/50 border border-white/10 rounded-lg p-3 flex justify-between items-center text-xs">
<div>
<div class="font-bold text-amber-200 text-sm">${escapeHtml(w.name)}</div>
<div class="text-gray-400 mt-0.5">由 ${escapeHtml(w.by)} 於 ${w.time} 填寫</div>
</div>
<button onclick="deleteWish(${index})" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 border border-red-500/20 rounded">
<i class="fa-solid fa-trash"></i> 刪除
</button>
</div>
`).join('');
}

function deleteWish(index) {
if (confirm('確定要刪除這個願望嗎？')) {
wishes.splice(index, 1);
saveWishes();
}
}

function copyShareLink() {
const temp = document.createElement('input');
temp.value = window.location.href;
document.body.appendChild(temp);
temp.select();
document.execCommand('copy');
document.body.removeChild(temp);
alert('網址已複製！');
}

function escapeHtml(text) {
return (text || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
}

renderWishes();
</script>
</body>
</html>
